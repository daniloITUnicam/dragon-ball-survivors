# Ogni push su main: compila il gioco e lo pubblica su GitHub Pages
# (dominio personalizzato: vedi docs/HOSTING.md).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build tools (esbuild minifies the page, Pillow turns the PNG sheets into lossless WebP)
        run: |
          npm i --no-save --no-package-lock esbuild@0.28.2
          pip install pillow
      - uses: actions/cache@v5   # the WebP conversions, by content (only new or changed sheets are converted again)
        with:
          path: dist/.cache
          key: webp-${{ hashFiles('assets/sprites/**/*.png') }}
          restore-keys: webp-
      - name: Build (single HTML file)
        # Impostazioni Supabase (login + salvataggi cloud): Settings → Secrets and variables → Actions → Variables.
        # Se non sono impostate il gioco funziona lo stesso, senza il pulsante Account.
        env:
          DBS_AUDIO: link   # la musica (assets/audio/) non viene incorporata: resta in assets/ accanto a index.html, a piena qualità
          DBS_SHEETS: ext   # gli sprite sono file in s/ (nome = contenuto): pagina leggera, il telefono scarica solo ciò che serve e li tiene in cache (sw.js)
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          SUPABASE_GOOGLE: ${{ vars.SUPABASE_GOOGLE }}
          TEST_OWNER: ${{ vars.TEST_OWNER }}   # e-mail del proprietario (Variables, non committata): nella pagina entra solo il suo hash
          TEST_LIST: ${{ vars.TEST_LIST }}     # opzionale: e-mail dei tester fissi, separate da virgola
          TEST_OWNER_HASH: ${{ vars.TEST_OWNER_HASH }}   # alternativa senza e-mail su GitHub: direttamente l'hash del proprietario (si calcola con: python3 build.py --hash <e-mail>)
          TEST_LIST_HASH: ${{ vars.TEST_LIST_HASH }}     # opzionale: gli hash dei tester fissi, separati da virgola
        run: python3 build.py --check
      - name: Prepare site
        run: |
          mkdir site
          cp dist/dragon-ball-survivors.html site/index.html
          cp dist/version.json site/version.json   # il gioco lo legge per accorgersi di una nuova versione (src/js/update.js)
          cp -r dist/s site/s
          cp dist/sw.js site/sw.js
          mkdir -p site/assets
          [ -d assets/audio ] && cp -r assets/audio site/assets/audio || true   # musica ed effetti sonori (cartelle music/ e sfx/)
          find assets -maxdepth 1 -type f \( -name '*.mp3' -o -name '*.ogg' -o -name '*.m4a' -o -name '*.wav' -o -name '*.mp4' \) -exec cp {} site/assets/ \;   # file sciolti (gacha.mp4)
          [ -f CNAME ] && cp CNAME site/CNAME || true
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # Pages a volte resta bloccato su "syncing_files" finché deploy-pages si arrende (10 minuti, non si possono aumentare):
      # un secondo tentativo con lo stesso artifact. (Per rilanciare a mano usa "Run workflow": "Re-run all jobs" crea un
      # secondo artifact "github-pages" nella stessa run e deploy-pages fallisce subito.)
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
