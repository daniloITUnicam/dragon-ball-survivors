# Ogni push su main: compila il gioco e lo pubblica su GitHub Pages
# (dominio personalizzato: vedi docs/HOSTING.md).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build (single HTML file)
        run: python3 build.py --check
      - name: Prepare site
        run: |
          mkdir site
          cp dist/dragon-ball-survivors.html site/index.html
          # la musica non è nel repo (licenza): se la aggiungi tu come file in assets/ viene incorporata
          [ -f CNAME ] && cp CNAME site/CNAME || true
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
